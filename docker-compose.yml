services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    volumes:
      - "./backend:/var/www:z"
    depends_on:
      - db
    networks:
      - default

  nginx:
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - "./backend:/var/www:z"
      - "./docker/nginx:/etc/nginx/conf.d:z"
    depends_on:
      - app
    networks:
      - default

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - "mysql_data:/var/lib/mysql:z"
    networks:
      - default

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - "./frontend:/app:z"
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host --port 3000"
    networks:
      - default

volumes:
  mysql_data:

networks:
  default:
    labels:
      com.docker.compose.network: "default"
